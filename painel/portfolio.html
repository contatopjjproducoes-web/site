<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>Portfólio | Painel PJJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head><body>

<header class="top">
  <a href="../" class="brand"><strong>PJJ</strong><span>PAINEL DO SITE</span></a>
  <nav class="nav">
    <a href="configuracoes.html" class="">Configurações</a>
    <a href="portfolio.html" class="active">Portfólio</a>
    <a href="metricas.html" class="">Métricas</a>
    <a href="publicar.html" class="">Publicar</a>
  </nav>
  <button class="btn ghost small" id="logoutBtn">Sair</button>
</header>
<main>
<section class="page-head">
  <p class="kicker">PORTFÓLIO</p><h1>Projetos</h1>
  <p>Adicione, reorganize ou remova trabalhos exibidos no site.</p>
</section>
<div class="section-head">
  <div><p class="kicker">PROJETOS</p><h2>Portfólio publicado</h2></div>
  <button class="btn primary" id="addProject">+ Adicionar projeto</button>
</div>
<div id="projects" class="projects"></div>
</main>
<script src="../config.js"></script>
<script src="../content.js"></script>
<script src="common.js"></script>
<script>
if(requireAuth()){
setupLogout();
let state=pjjGetState(); const $=s=>document.querySelector(s);
function save(){pjjSaveState(state)}
function compress(file,maxW=1800,q=.84){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const rt=Math.min(1,maxW/img.width),w=Math.round(img.width*rt),h=Math.round(img.height*rt),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(new Error()),'image/jpeg',q)};img.src=r.result};r.readAsDataURL(file)})
}
function render(){
 const el=$('#projects');el.innerHTML='';state.content.portfolio=Array.isArray(state.content.portfolio)?state.content.portfolio:[];
 state.content.portfolio.forEach((item,i)=>el.appendChild(editor(item,i)));
 if(!state.content.portfolio.length)el.innerHTML='<div class="empty-state">Nenhum projeto cadastrado.</div>';
}
function editor(item,index){
 const wrap=document.createElement('article');wrap.className='project-editor';
 const preview=item._preview||item.image||'';
 wrap.innerHTML=`<div><div class="project-image">${preview?`<img src="${pjjEsc(preview)}">`:`<div class="empty">Nenhuma foto<br>selecionada</div>`}</div>
 <div class="image-controls"><label class="btn small primary">Escolher foto<input class="file-input" type="file" accept="image/*"></label><button class="btn small ghost remove">Remover foto</button></div></div>
 <div class="project-fields"><label class="field"><span>Título</span><input class="title" value="${pjjEsc(item.title)}"></label>
 <label class="field"><span>Categoria</span><select class="type"><option value="video" ${item.type==='video'?'selected':''}>Audiovisual</option><option value="drone" ${item.type==='drone'?'selected':''}>Drone</option><option value="mapping" ${item.type==='mapping'?'selected':''}>Mapeamento</option></select></label>
 <label class="field full"><span>Descrição curta / cliente</span><input class="subtitle" value="${pjjEsc(item.subtitle)}"></label>
 <label class="field full"><span>Etiqueta</span><input class="tag" maxlength="24" value="${pjjEsc(item.tag||'PROJETO')}"></label></div>
 <div class="editor-actions"><div class="move-group"><button class="btn small ghost up">↑ Subir</button><button class="btn small ghost down">↓ Descer</button></div><button class="btn small danger delete">Excluir</button></div>`;
 const sync=()=>{item.title=wrap.querySelector('.title').value;item.subtitle=wrap.querySelector('.subtitle').value;item.tag=wrap.querySelector('.tag').value;item.type=wrap.querySelector('.type').value;item.id=item.id||pjjSlug(item.title);save()};
 wrap.querySelectorAll('input:not(.file-input),select').forEach(e=>e.addEventListener('input',sync));
 wrap.querySelector('.file-input').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const blob=await compress(f);item.id=item.id||pjjSlug(item.title)+'-'+Date.now();const filename=pjjSlug(item.title||item.id)+'-'+String(index+1).padStart(2,'0')+'.jpg';item.image='assets/portfolio/'+filename;item._preview=URL.createObjectURL(blob);const rd=new FileReader();rd.onload=()=>{item._data=rd.result;save();render();pjjToast('Foto adicionada.')};rd.readAsDataURL(blob)};
 wrap.querySelector('.remove').onclick=()=>{item.image='';item._preview='';item._data='';save();render()};
 wrap.querySelector('.delete').onclick=()=>{if(confirm('Excluir este projeto?')){state.content.portfolio.splice(index,1);save();render()}};
 wrap.querySelector('.up').onclick=()=>{if(index<1)return;[state.content.portfolio[index-1],state.content.portfolio[index]]=[state.content.portfolio[index],state.content.portfolio[index-1]];save();render()};
 wrap.querySelector('.down').onclick=()=>{if(index>=state.content.portfolio.length-1)return;[state.content.portfolio[index+1],state.content.portfolio[index]]=[state.content.portfolio[index],state.content.portfolio[index+1]];save();render()};
 return wrap
}
$('#addProject').onclick=()=>{state.content.portfolio.push({id:'projeto-'+Date.now(),title:'Novo projeto',subtitle:'Projeto / Cliente',tag:'PROJETO',type:'video',image:''});save();render()};
render();
}
</script>
</body></html>
