<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Login | Painel PJJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<section class="login-screen">
  <form class="login-card" id="loginForm">
    <div class="brand-lock"><strong>PJJ</strong><span>PAINEL</span></div>
    <p class="kicker">ÁREA DE EDIÇÃO</p>
    <h1>Acesso ao painel</h1>
    <p class="muted">Entre para gerenciar as informações do site.</p>
    <label class="field"><span>Senha</span><input id="passwordInput" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide" type="submit" style="margin-top:16px">Entrar</button>
    <p class="login-error" id="loginError"></p>
  </form>
</section>
<script src="../config.js"></script>
<script>
if(sessionStorage.getItem('pjj_panel_ok')==='1'){
  location.replace('configuracoes.html');
}
document.getElementById('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const pass=document.getElementById('passwordInput').value;
  const expected=window.PJJ_CONFIG?.panel?.password || '';
  if(pass===expected){
    sessionStorage.setItem('pjj_panel_ok','1');
    location.replace('configuracoes.html');
  }else{
    document.getElementById('loginError').textContent='Senha incorreta.';
  }
});
</script>
</body>
</html>
